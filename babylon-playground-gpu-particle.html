<!doctype html>
<!--
  Babylon.js GPUParticleSystem benchmark — WebGL2 vs WebGPU, same scene.

  GPUParticleSystem runs the particle update on the GPU:
    * WebGPU : compute shader
    * WebGL2 : transform feedback
  So this is a GPU-bound particle test (the CPU ParticleSystem in index.html is not).

  Backend selection:
    ?backend=auto | webgl | webgpu   (default auto = WebGPU if available, else WebGL2)
    ?webgpu                          (shorthand for backend=webgpu)
    The overlay prints the ACTUAL engine ("WebGPUEngine" vs "Engine"/"ThinEngine"),
    so in auto mode you can see which backend was chosen.
  Heaviness knobs:
    ?cap=N      particle capacity (default 1500000)
    ?emit=N     emit rate (default 300000)
    ?size=F     particle max size (default 0.2)
  Timed measurement (like the other PERF benchmarks):
    ?seconds=S  measure S s after warmup, then print mean/p50/p95/p99 ms + slow frames
                (default 0 = run forever, rolling FPS only)
    ?warmup=F   frames skipped before measuring (default 60)
  Press 'r' to restart the measurement window.

  A/B: open the same file with ?backend=webgl then ?backend=webgpu and compare the
  FPS in the top-left overlay (which also prints the engine name so you can confirm
  WebGL2 = "Engine"/"ThinEngine" vs WebGPU = "WebGPUEngine", and the adapter).
-->
<html>
<head>
  <meta charset="utf-8"/>
  <title>Babylon GPUParticleSystem — WebGL vs WebGPU</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <style>
    html,body,#renderCanvas{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#000}
    #hud{position:fixed;top:8px;left:8px;z-index:999;font:13px/1.5 monospace;color:#9fe;
         background:rgba(0,0,0,.6);padding:7px 10px;border-radius:6px;white-space:pre;pointer-events:none}
    #summary{position:fixed;top:8px;right:8px;z-index:999;font:13px/1.5 monospace;color:#aef0c0;
         background:rgba(0,0,0,.6);padding:7px 10px;border-radius:6px;white-space:pre;max-width:46vw;pointer-events:none}
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="hud">starting…</div>
  <div id="summary"></div>
  <script type="module">
    const BABYLON = window.BABYLON;
    const canvas  = document.getElementById('renderCanvas');
    const hud     = document.getElementById('hud');

    const Q       = new URLSearchParams(location.search.replace(/&amp;/g,'&'));
    // backend: 'auto' (default) = WebGPU if available else WebGL; or force 'webgl' / 'webgpu'.
    const REQ     = Q.has('webgpu') ? 'webgpu' : (Q.get('backend') || 'auto').toLowerCase();
    const CAP     = Math.max(1000, parseInt(Q.get('cap')  || '200000', 10));  // start safe; raise gradually
    const EMIT    = Math.max(1000, parseInt(Q.get('emit') || '50000', 10));
    const PSIZE   = parseFloat(Q.get('size') || '0.2');
    const PARTS   = (Q.get('particles') || 'auto').toLowerCase();  // gpu | cpu | auto (diagnose)
    const SECONDS = parseFloat(Q.get('seconds') || '0');
    const WARMUP  = Math.max(0, parseInt(Q.get('warmup') || '60', 10));

    // best-effort WebGPU adapter readout (Vulkan vs GLES hint)
    async function adapterLine(){
      if (!navigator.gpu) return 'navigator.gpu: undefined';
      try { const a = await navigator.gpu.requestAdapter(); if(!a) return 'WebGPU adapter: null';
        const i = a.info || {}; return 'adapter: ' + [i.vendor,i.architecture,i.device,i.description].filter(Boolean).join(' / '); }
      catch(e){ return 'adapter query failed: '+e.message; }
    }

    // Pick engine: 'auto' uses WebGPU when supported, else WebGL; 'webgpu'/'webgl' force it.
    async function makeEngine(){
      const wgpuSupported = !!BABYLON.WebGPUEngine && await BABYLON.WebGPUEngine.IsSupportedAsync;
      const useGPU = (REQ === 'webgpu') || (REQ === 'auto' && wgpuSupported);
      if (useGPU && wgpuSupported){
        const e = new BABYLON.WebGPUEngine(canvas, { antialias:false, stencil:true });
        await e.initAsync();                       // loads glslang/twgsl from CDN
        return e;
      }
      if (REQ === 'webgpu' && !wgpuSupported)
        console.warn('WebGPU requested but unsupported → falling back to WebGL2');
      return new BABYLON.Engine(canvas, false, { preserveDrawingBuffer:true, stencil:true });
    }

    // Local radial-gradient dot texture (no network, no CORS — works on WebGPU from file://).
    function makeDotTexture(scene){
      const SZ = 64;
      const dt = new BABYLON.DynamicTexture('dot', { width: SZ, height: SZ }, scene, false);
      const ctx = dt.getContext();
      const g = ctx.createRadialGradient(SZ/2, SZ/2, 0, SZ/2, SZ/2, SZ/2);
      g.addColorStop(0.0, 'rgba(255,255,255,1)');
      g.addColorStop(0.35, 'rgba(180,210,255,0.7)');
      g.addColorStop(1.0, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, SZ, SZ);
      dt.update();
      dt.hasAlpha = true;
      return dt;
    }

    let particleMode = '';
    function createScene(engine){
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0.067, 0.054, 0.157, 1.0);   // Color4 w/ alpha=1
      const camera = new BABYLON.ArcRotateCamera('cam', 0, Math.PI/2.2, 30, BABYLON.Vector3.Zero(), scene);
      camera.attachControl(canvas, true);

      // DIAGNOSTIC reference object — a big emissive wireframe box, independent of particles/texture.
      //   * box visible but no particles  → particle-specific issue (try &particles=cpu).
      //   * even the box is black          → WebGPU isn't rendering at all (check DevTools console;
      //                                       serve over http instead of file://).
      const box = BABYLON.MeshBuilder.CreateBox('ref', { size: 10 }, scene);
      const bmat = new BABYLON.StandardMaterial('bm', scene);
      bmat.emissiveColor = new BABYLON.Color3(0.25, 0.6, 0.4); bmat.disableLighting = true; bmat.wireframe = true;
      box.material = bmat;
      scene.registerBeforeRender(()=>{ box.rotation.y += 0.01; camera.alpha += 0.003; });

      // Particle system: GPU (compute/transform-feedback) or CPU. ?particles=gpu|cpu|auto.
      const useGPU = (PARTS === 'gpu') || (PARTS === 'auto' && BABYLON.GPUParticleSystem.IsSupported);
      const ps = useGPU
        ? new BABYLON.GPUParticleSystem('p', { capacity: CAP }, scene)
        : new BABYLON.ParticleSystem('p', Math.min(CAP, 50000), scene);   // CPU fallback (capped)
      particleMode = useGPU ? 'GPUParticleSystem' : 'ParticleSystem(CPU)';

      // Local dot texture (no cross-origin fetch — WebGPU rejects tainted textures on file://).
      ps.particleTexture = makeDotTexture(scene);
      ps.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;   // additive glow on dark bg
      ps.emitter = BABYLON.Vector3.Zero();
      ps.createSphereEmitter(8);
      ps.emitRate = EMIT;
      ps.minLifeTime = 2; ps.maxLifeTime = 5;
      ps.minSize = 0.3; ps.maxSize = Math.max(PSIZE, 0.8);     // bigger so they're clearly visible
      ps.minEmitPower = 1; ps.maxEmitPower = 4;
      ps.updateSpeed = 0.01;
      ps.start();
      return scene;
    }

    let engine, isWebGPU, BACKEND, adapter, scene;
    try {
      engine   = await makeEngine();
      isWebGPU = !!(BABYLON.WebGPUEngine && engine instanceof BABYLON.WebGPUEngine);
      BACKEND  = isWebGPU ? 'WebGPU' : 'WebGL2';      // active backend, shown on HUD
      adapter  = isWebGPU ? await adapterLine() : `WebGL2 (requested: ${REQ})`;
      scene    = createScene(engine);
    } catch (e) {
      hud.textContent = 'INIT ERROR (' + REQ + '): ' + ((e && e.message) || e) +
        '\nTry serving over http (not file://) and check the DevTools console.';
      console.error(e);
      throw e;
    }
    let renderErr = '';
    // Surface a lost device/context (e.g. too many particles → GPU OOM / watchdog → black).
    if (engine.onContextLostObservable)
      engine.onContextLostObservable.add(()=>{ renderErr = 'CONTEXT/DEVICE LOST — lower ?cap (GPU OOM/watchdog?)'; console.error('context lost'); });
    engine.runRenderLoop(()=>{
      try { scene.render(); }
      catch(e){ if(!renderErr){ renderErr = String((e && e.message) || e); console.error(e); } }
    });
    addEventListener('resize', ()=>engine.resize());

    // ---- timed FPS measurement (same logic as the other PERF benchmarks) ----
    const summary = document.getElementById('summary');
    let samples=[], frameNo=0, collecting=false, collectStart=0, done=false, rolling=[], prev=0;
    function resetStats(){ samples=[]; frameNo=0; collecting=false; done=false; rolling=[]; prev=0; summary.textContent=''; }
    function finalize(){
      done=true; collecting=false;
      if(!samples.length){ summary.textContent='no samples'; return; }
      const s=[...samples].sort((a,b)=>a-b), mean=s.reduce((a,b)=>a+b,0)/s.length;
      const p=q=>s[Math.min(s.length-1, Math.floor(s.length*q))];
      const r={frames:s.length, meanFps:+(1000/mean).toFixed(1),
        p50ms:+p(.5).toFixed(2), p95ms:+p(.95).toFixed(2), p99ms:+p(.99).toFixed(2),
        minms:+s[0].toFixed(2), maxms:+s[s.length-1].toFixed(2), slow_gt33ms:s.filter(x=>x>33.3).length};
      summary.textContent =
        `=== RESULT — ${BACKEND} (${engine.constructor.name}) ===\n`+
        `particles: cap ${CAP.toLocaleString()}  emit ${EMIT.toLocaleString()}\n`+
        `frames   : ${r.frames}\n`+
        `mean FPS : ${r.meanFps}\n`+
        `p50/p95/p99 ms : ${r.p50ms} / ${r.p95ms} / ${r.p99ms}\n`+
        `min/max ms     : ${r.minms} / ${r.maxms}\n`+
        `slow >33ms     : ${r.slow_gt33ms}`;
      console.log('[babylon A/B]', {backend:BACKEND, engine:engine.constructor.name, cap:CAP, emit:EMIT, ...r});
      console.table([{backend:BACKEND, cap:CAP, ...r}]);
    }
    addEventListener('keydown', e=>{ if(e.key==='r') resetStats(); });

    scene.onAfterRenderObservable.add(()=>{
      const now = performance.now();
      if(!prev) prev = now;
      const dt = now - prev; prev = now;
      frameNo++;
      rolling.push(dt); if(rolling.length>30) rolling.shift();
      const rfps = 1000/(rolling.reduce((a,b)=>a+b,0)/rolling.length);
      if(!done && frameNo>WARMUP){
        if(!collecting){ collecting=true; collectStart=now; }
        samples.push(dt);
        if(SECONDS>0 && (now-collectStart)/1000 >= SECONDS) finalize();
      }
      hud.textContent =
        `ACTIVE BACKEND: ${BACKEND}   (${engine.constructor.name}, req=${REQ})\n`+
        `${rfps.toFixed(1)} fps   ${dt.toFixed(2)} ms\n`+
        `particles: ${particleMode}  cap ${CAP.toLocaleString()}  emit ${EMIT.toLocaleString()}\n`+
        `${adapter}\n`+
        (renderErr ? `RENDER ERROR: ${renderErr}\n` : ``)+
        (SECONDS>0
          ? (done ? `measure: DONE (press 'r' to rerun)`
                  : (collecting ? `measure: ${((now-collectStart)/1000).toFixed(1)}/${SECONDS}s` : `warmup…`))
          : `measure: rolling (add ?seconds=10 for a summary)`);
    });
  </script>
</body>
</html>
