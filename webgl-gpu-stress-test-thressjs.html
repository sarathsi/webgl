<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WebGL vs WebGPU Apples-to-Apples Stress Test</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; }
        #ui {
            position: absolute; top: 10px; left: 10px; padding: 15px;
            background: rgba(0,0,0,0.85); color: white; border-radius: 8px;
            z-index: 100; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button {
            background: #007acc; color: white; border: none; padding: 8px 12px;
            font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px;
        }
        button:hover { background: #0098ff; }
        .stats-val { font-weight: bold; color: #00ffcc; }
    </style>
</head>
<body>

    <div id="ui">
        <h3>Backend Performance Test</h3>
        <div>Active Backend: <span id="backend-type" class="stats-val">Detecting...</span></div>
        <div>Current FPS: <span id="fps-counter" class="stats-val">0</span></div>
        <div>Object Count: <span class="stats-val">6,000 Cubes</span></div>
        <button id="toggle-btn">Force Toggle Backend</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.171.0/build/three.webgpu.js",
                "three/webgpu": "https://unpkg.com/three@0.171.0/build/three.webgpu.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { WebGPURenderer } from 'three/webgpu';

        // Check URL parameters to see if we forced WebGL
        const urlParams = new URLSearchParams(window.location.search);
        const forceWebGL = urlParams.get('mode') === 'webgl';

        let scene, camera, renderer, meshes = [];
        const objectCount = 6000; // Adjust this higher or lower to stress your specific GPU

        // FPS counter variables
        let lastTime = performance.now();
        let frameCount = 0;
        const fpsElement = document.getElementById('fps-counter');

        async function init() {
            // 1. Create Scene & Camera
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 120;

            // 2. Initialize Unified Renderer
            // Setting 'forceWebGL' changes the rendering engine without changing any application logic
            renderer = new WebGPURenderer({ antialias: true, forceWebGL: forceWebGL });
            await renderer.init(); 
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Update UI with what backend is actively rendering
            document.getElementById('backend-type').innerText = forceWebGL ? "WebGL 2 (Forced)" : "WebGPU";

            // 3. Generate identical heavy geometry data
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshBasicMaterial({ color: 0x00aaff, wireframe: false });

            // Spawn separate draw calls to stress CPU command submission bottlenecks
            for (let i = 0; i < objectCount; i++) {
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(
                    (Math.random() - 0.5) * 150,
                    (Math.random() - 0.5) * 150,
                    (Math.random() - 0.5) * 150
                );
                mesh.userData = {
                    speedX: (Math.random() - 0.5) * 0.5,
                    speedY: (Math.random() - 0.5) * 0.5,
                    speedZ: (Math.random() - 0.5) * 0.5
                };
                scene.add(mesh);
                meshes.push(mesh);
            }

            // Handle UI toggle button clicks
            document.getElementById('toggle-btn').addEventListener('click', () => {
                const nextMode = forceWebGL ? 'webgpu' : 'webgl';
                window.location.search = `?mode=${nextMode}`;
            });

            window.addEventListener('resize', onWindowResize);
            
            // Start Loop
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Move the geometry predictably across frames
            for (let i = 0; i < objectCount; i++) {
                const mesh = meshes[i];
                mesh.position.x += mesh.userData.speedX;
                mesh.position.y += mesh.userData.speedY;
                mesh.position.z += mesh.userData.speedZ;

                // Bounce boundaries
                if (Math.abs(mesh.position.x) > 75) mesh.userData.speedX *= -1;
                if (Math.abs(mesh.position.y) > 75) mesh.userData.speedY *= -1;
                if (Math.abs(mesh.position.z) > 75) mesh.userData.speedZ *= -1;
                
                // Slow rotation
                mesh.rotation.x += 0.01;
                mesh.rotation.y += 0.02;
            }

            // Render Frame
            renderer.render(scene, camera);

            // Calculate FPS metrics
            frameCount++;
            const time = performance.now();
            if (time >= lastTime + 1000) {
                fpsElement.innerText = Math.round((frameCount * 1000) / (time - lastTime));
                frameCount = 0;
                lastTime = time;
            }
        }

        init();
    </script>
</body>
</html>
